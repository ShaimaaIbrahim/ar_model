# 1. الاعتماد على قواعد شركة Very Good Ventures (المعيار الذهبي حالياً)
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # تفعيل الإضافات المخصصة مثل custom_lint
  plugins:
    - custom_lint

  # استثناء ملفات الكود المولد تلقائياً (مثل الـ Models أو الـ Routes)
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/generated_plugin_registrant.dart"

  # تحويل التحذيرات الهامة إلى أخطاء تمنع الـ Build في الـ CI
  errors:
    invalid_annotation_target: ignore
    todo: info
    # أي مخالفة للقواعد التالية ستعتبر خطأ قاتل (Fatal)
    avoid_print: error
    dead_code: error
    always_declare_return_types: error

linter:
  rules:
    # قواعد إضافية لتعزيز الـ Clean Architecture
    - sort_pub_dependencies: true
    - prefer_single_quotes: true
    - avoid_unnecessary_containers: true
    - sized_box_for_whitespace: true
    - use_key_in_widget_constructors: true
    # منع استخدام الـ dynamic لضمان Type Safety
    - avoid_annotating_with_dynamic: true
    # إجبارية استخدام الـ const لتقليل الـ Rebuilds وتحسين الأداء
    - prefer_const_constructors: true
    - prefer_const_literals_to_create_immutables: true
